[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wq-pipeline"
version = "0.1.0"
description = "EU inland water quality parameter estimation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "requests>=2.32",
  "joblib>=1.5",
  "matplotlib>=3.9",
  "mgrs>=1.5",
  "folium>=0.20",
  "geopandas>=0.14",
  "contextily>=1.6",
  "rasterio>=1.4",
  "planetary-computer>=1.0",
  "torch>=2.10",
  "transformers>=4.46",
  "timm>=1.0",
  "Pillow>=10.4",
]

[project.scripts]
wq = "wq_pipeline.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
